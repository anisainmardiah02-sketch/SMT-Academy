var QUIZ=[
{t:'basics',q:'What does PCBA stand for?',o:['Printed Circuit Board Assembly','Printed Circuit Board Analysis','Process Control Board Application','Printed Chip Board Alignment'],e:'A PCB is the bare board. A PCBA is the board with the components soldered on.'},
{t:'basics',q:'What does SMT stand for?',o:['Surface Mount Technology','Solder Mask Treatment','Surface Metal Test','Single Mount Tooling'],e:'In SMT, parts sit on the surface of the board and are soldered to pads.'},
{t:'basics',q:'Which technology uses leads that pass through holes in the board?',o:['THT (through-hole)','SMT','BGA','QFN'],e:'THT means through-hole technology. The leads go through plated holes and are soldered, often by wave soldering.'},
{t:'basics',q:'Which is the correct start of a typical SMT line?',o:['Loader → Printer → SPI → Mounter','Mounter → Printer → Loader → SPI','Printer → Loader → Mounter → SPI','SPI → Loader → Printer → Mounter'],e:'Boards are loaded, paste is printed, the paste is inspected, and then parts are placed.'},
{t:'basics',q:'What is solder paste made of?',o:['Tiny solder balls mixed with flux','Liquid glue and plastic','Pure copper powder','Silicone and water'],e:'The solder balls form the joint and the flux cleans the surfaces so solder can wet.'},
{t:'basics',q:'Roughly how big is a 0402 chip component?',o:['1.0 × 0.5 mm','4 × 2 mm','0.4 × 0.2 mm','10 × 5 mm'],e:'0402 is 0.04 × 0.02 inch, about 1.0 × 0.5 mm.'},
{t:'basics',q:'What is a fiducial?',o:['A small mark that cameras use to find the board position','A type of solder alloy','A cleaning solvent','A tool for cutting boards'],e:'Fiducials let printers, mounters and inspection machines align accurately to each board.'},
{t:'loader',q:'What is the job of the PCB loader?',o:['Feed bare boards one by one into the line','Place components on the board','Melt the solder paste','Inspect solder joints'],e:'The loader pushes boards from a magazine onto the conveyor toward the printer.'},
{t:'loader',q:'What does SMEMA do?',o:['Sends ready and available signals between machines','Measures solder paste','Cleans the stencil','Controls oven temperature'],e:'SMEMA is the handshake: "board available" from one machine and "machine ready" from the next.'},
{t:'loader',q:'Why check which side of the board is up before loading?',o:['Wrong side can scrap a whole batch','It makes the board cooler','It changes the paste type','It is only a safety rule'],e:'Printing or placing on the wrong side is expensive and often cannot be recovered.'},
{t:'loader',q:'Bare boards stored open for a long time may need:',o:['Baking to remove moisture','Painting','Extra fiducials','Higher paste volume'],e:'Absorbed moisture can blister or delaminate boards in reflow. Follow the supplier’s baking rule.'},
{t:'printer',q:'Where should solder paste normally be stored?',o:['In a refrigerator (about 0 to 10 °C)','On a warm shelf near the oven','In direct sunlight','In a freezer at −40 °C'],e:'Cold storage slows the chemical ageing of the flux. Check the paste datasheet.'},
{t:'printer',q:'Before use, a sealed paste jar from the fridge should:',o:['Warm up to room temperature (about 4 hours) without heating','Be heated in an oven to speed it up','Be opened immediately','Be shaken hard on the stencil'],e:'Opening a cold jar draws in moisture, which causes solder balls and poor printing.'},
{t:'printer',q:'Which part of the printer pushes paste through the stencil?',o:['The squeegee','The nozzle','The conveyor','The chiller'],e:'The squeegee moves across the stencil and fills the apertures with paste.'},
{t:'printer',q:'Why is the underside of the stencil wiped regularly?',o:['To prevent smear and bridging','To make the stencil warmer','To change the paste colour','To reduce the machine noise'],e:'Paste collects under the stencil and smears onto the board if it is not wiped.'},
{t:'printer',q:'How should the board and stencil separate after printing?',o:['Slowly and smoothly','As fast as possible','With a jerk','Only after drying'],e:'Slow separation lets paste release cleanly and avoids peaks and dog-ears.'},
{t:'printer',q:'What does a good area ratio (≥ 0.66) help with?',o:['Clean paste release from the apertures','Faster conveyor speed','Lower oven temperature','Better barcode reading'],e:'If the opening is too small compared with the stencil thickness, paste sticks in the walls.'},
{t:'printer',q:'Paste that looks dry and does not roll on the stencil will mostly cause:',o:['Insufficient paste and poor printing','Faster reflow','Better wetting','Thicker solder joints'],e:'Dry paste does not fill apertures properly. Replace it with fresh paste.'},
{t:'spi',q:'What does SPI measure?',o:['Paste volume, height, area and position','Component polarity','Reflow temperature','Board thickness'],e:'SPI measures every paste deposit with a 3D sensor.'},
{t:'spi',q:'When is SPI done?',o:['After printing and before placing parts','After wave soldering','After depaneling','Before the loader'],e:'Fixing a bad print is cheap before parts are placed.'},
{t:'spi',q:'SPI reports many false fails. What is the best first action?',o:['Clean the lens, check support and tune limits with real data','Widen all the limits until there are no fails','Switch off the machine','Ignore the alarms'],e:'Never hide a problem by widening limits without checking the data.'},
{t:'spi',q:'The same pad shows low paste volume on every board. The likely cause is:',o:['A clogged stencil aperture','A faulty conveyor belt','Too much nitrogen','A wrong barcode'],e:'A blocked aperture prints less on that pad every time.'},
{t:'spi',q:'What can SPI data be sent back to the printer for?',o:['Closed-loop correction of drift','Printing barcodes','Changing the oven profile','Cutting panels'],e:'Feedback lets the printer adjust alignment or settings automatically.'},
{t:'mounter',q:'What holds the component on the nozzle?',o:['Vacuum','Glue','Magnet','Static electricity'],e:'The nozzle uses vacuum to pick and hold the part.'},
{t:'mounter',q:'What is first article inspection (FAI)?',o:['Checking the first board after a changeover against the BOM and drawing','The last check before shipping','A cleaning step','Inspecting the paste jar'],e:'FAI catches setup mistakes (wrong part, polarity) before running the whole lot.'},
{t:'mounter',q:'Many missing parts are most often caused by:',o:['A worn or dirty nozzle or low vacuum','Too much paste','A hot oven','Wrong barcode paper'],e:'Failed picks happen when the nozzle is dirty, worn or the vacuum is weak.'},
{t:'mounter',q:'Why scan the reel barcode at setup?',o:['To verify the correct part for the feeder slot','To print labels','To change the program','To clean the nozzle'],e:'Barcode verification prevents wrong or mixed reels from being used.'},
{t:'mounter',q:'Placement force that is too high can cause:',o:['Cracked parts and paste squeezed out','Colder joints','Longer reflow','Dirty stencil'],e:'Too much force damages fragile parts and pushes paste sideways, causing bridges or balls.'},
{t:'aoi',q:'What is the main benefit of AOI before reflow?',o:['Placement errors are found while still easy to fix','It melts the solder','It measures paste volume','It cuts the panel'],e:'Before reflow the paste is wet, so parts can be moved or replaced quickly.'},
{t:'aoi',q:'Which joints can AOI NOT see?',o:['Hidden joints under a BGA','Chip resistor joints','Joints on QFP leads','Component polarity marks'],e:'Cameras cannot see under the part. Use X-ray for BGA and QFN.'},
{t:'aoi',q:'What is a "false call"?',o:['AOI flags a good board or part as bad','AOI misses a real defect','A wrong call from the supervisor','A wrong oven temperature'],e:'False calls waste time. Too many make people stop trusting the machine.'},
{t:'aoi',q:'What is an "escape" in inspection?',o:['A real defect that the inspection passed','A board that falls off the belt','A cleaning step','A fast conveyor'],e:'Escapes are dangerous because the defect continues to the customer.'},
{t:'aoi',q:'What is a golden board?',o:['A known good reference board','A gold-plated board','A board with extra paste','A broken test board'],e:'It is used to teach and check the inspection program.'},
{t:'reflow',q:'Approximately what is the melting point of SAC305 solder?',o:['217 °C','100 °C','183 °C','300 °C'],e:'SAC305 melts at about 217 °C. Tin-lead (63/37) melts at 183 °C.'},
{t:'reflow',q:'What is the correct order of reflow stages?',o:['Preheat → Soak → Reflow (peak) → Cooling','Cooling → Reflow → Soak → Preheat','Soak → Cooling → Preheat → Reflow','Reflow → Preheat → Cooling → Soak'],e:'The board heats gradually, equalises, melts, and then cools to freeze the joints.'},
{t:'reflow',q:'What does TAL stand for?',o:['Time Above Liquidus','Total Alloy Level','Temperature Above Limit','Time After Loading'],e:'TAL is how long the solder stays above its melting point.'},
{t:'reflow',q:'A preheat ramp that is too fast can cause:',o:['Solder balls and tombstoning','Better wetting','Lower voids','Stronger joints'],e:'Fast heating spatters paste and heats pads unevenly.'},
{t:'reflow',q:'Why run a profile with thermocouples on a board?',o:['To check real board temperatures against the specification','To clean the oven','To count boards','To test paste weight'],e:'The oven setting is not the board temperature. The profile proves what the board sees.'},
{t:'reflow',q:'The peak temperature must never exceed:',o:['The lowest maximum temperature of any component on the board','The factory room temperature','The paste fridge temperature','0 °C'],e:'Each part has a maximum temperature rating (often 260 °C). Check the datasheets.'},
{t:'reflow',q:'What does nitrogen in a reflow oven reduce?',o:['Oxidation and it helps wetting','Board size','Part cost','Conveyor speed'],e:'Lower oxygen gives cleaner surfaces and better solder flow.'},
{t:'xray',q:'Why is X-ray used on BGA and QFN?',o:['Their joints are hidden under the part','They are too large for cameras','They are always lead-free','They have no solder'],e:'Cameras cannot see joints beneath the package.'},
{t:'xray',q:'On an X-ray image, solder usually looks:',o:['Darker than voids','Lighter than voids','The same as air','Invisible'],e:'Dense solder absorbs more X-rays. Voids contain gas and look lighter.'},
{t:'xray',q:'A commonly used limit for BGA ball voids is about:',o:['25 % of the ball area','80 % of the ball area','2 % of the board','100 % of the pad'],e:'IPC-A-610 commonly uses 25 %. Always follow your company or customer standard.'},
{t:'xray',q:'Which is a safety rule for X-ray equipment?',o:['Never bypass the interlocks','Open the door while it is on','Leave it on all night','Use it without training'],e:'Interlocks protect people from radiation. Only trained users should operate the machine.'},
{t:'axi',q:'What is the difference between AXI and manual X-ray?',o:['AXI is automatic and decides pass or fail inline','AXI uses visible light','AXI is only for bare boards','There is no difference'],e:'AXI inspects boards in the line automatically and records the results.'},
{t:'axi',q:'Why is 3D AXI used for double-sided boards?',o:['It separates top and bottom joints that overlap in 2D','It is cheaper','It does not use X-rays','It cools the board'],e:'3D slicing images only the layer you want to inspect.'},

{t:'autoins',q:'Why are the leads clinched (bent) under the board?',o:['To hold the part until it is soldered','To make the board heavier','To cool the part','To clean the leads'],e:'Clinching keeps the part from falling out before wave soldering.'},
{t:'autoins',q:'Which is a good hole size relative to the lead?',o:['Lead diameter + about 0.3 to 0.4 mm','Exactly the lead diameter','Lead diameter + 3 mm','Half the lead diameter'],e:'Too tight bends the lead. Too big gives a loose part and poor fill.'},
{t:'pressfit',q:'How is a press-fit connection made?',o:['Compliant pins are pressed into plated holes without solder','By melting solder paste','With glue','By screws only'],e:'The pin springs against the hole wall and makes a gas-tight connection.'},
{t:'pressfit',q:'What does a press machine record to check quality?',o:['Force against distance (the force curve)','The room humidity','The paste volume','The oven profile'],e:'The curve shows if the hole or pin is wrong and if the connector was seated.'},
{t:'pressfit',q:'What should be done with a press-fit connector that has been removed?',o:['Do not reuse it','Reuse it on any board','Heat it','Add flux and reuse'],e:'Pulling it out damages pins and plating.'},
{t:'wave',q:'What is the order of wave soldering?',o:['Flux → Preheat → Wave → Cooling','Wave → Flux → Cooling → Preheat','Cooling → Wave → Preheat → Flux','Preheat → Cooling → Flux → Wave'],e:'Flux cleans the metal, preheat activates it, the wave solders, and cooling sets the joints.'},
{t:'wave',q:'A typical wave contact time is about:',o:['2 to 4 seconds','30 seconds','10 minutes','0.1 second'],e:'Longer contact can damage parts. Shorter may not fill holes.'},
{t:'wave',q:'Why is the board preheated before the wave?',o:['To activate flux and reduce thermal shock','To melt the solder','To clean the board','To dry the conveyor'],e:'Gradual heating protects parts and helps solder flow into holes.'},
{t:'wave',q:'Leads that are too long under the board often cause:',o:['Bridging and icicles','Better fill','Lower temperature','Less flux use'],e:'Long leads pick up too much solder and can touch each other.'},
{t:'wave',q:'What is a commonly used minimum hole fill for Class 2 and 3?',o:['About 75 %','About 10 %','100 % always','25 %'],e:'Solder should fill at least about three quarters of the hole height. Check your standard.'},
{t:'wave',q:'Why analyse the solder pot regularly?',o:['To check copper, lead and iron contamination','To measure the board weight','To change the conveyor','To count boards'],e:'Contamination makes solder dull, grainy and bridging-prone.'},

{t:'router',q:'Why should panels not be broken by hand?',o:['Bending can crack ceramic capacitors','It is too slow','It changes the board colour','It damages the router bit'],e:'Hidden cracks may cause failures later in the field.'},
{t:'router',q:'Why is router dust a problem?',o:['It can contaminate boards and cause shorts','It makes boards heavier','It cools the machine','It is a paste material'],e:'Fibreglass and copper dust are conductive or abrasive. Remove it.'},
{t:'router',q:'A worn router bit usually causes:',o:['Burrs and rough edges','Faster cutting','Cooler boards','Better edges'],e:'Change the bit at the planned interval.'},

{t:'faoi',q:'What does FAOI check that SMT AOI may not?',o:['Through-hole parts, connectors, labels and routing damage','Solder paste height','Reflow profile','Paste jar date'],e:'FAOI covers the whole finished board.'},
{t:'faoi',q:'What must happen to a repaired board?',o:['It must be inspected again','It can be shipped directly','It is scrapped','It is painted'],e:'Rework can create new defects, so re-inspect.'},
{t:'defects',q:'What is tombstoning?',o:['A chip stands on one end because one side wets first','A bridge between two pads','A missing component','A burnt board'],e:'Uneven heating, uneven paste or placement shift causes it.'},
{t:'defects',q:'What is head-in-pillow?',o:['A BGA ball that sits on the paste without merging into one joint','A bent connector pin','Paste slump','A burr on the board edge'],e:'It can pass a visual and a basic test but fail later. X-ray at an angle or 3D AXI finds it.'},

var FAQ=[
{c:'Basics',q:'What is the difference between a PCB and a PCBA?',a:'A PCB is the bare circuit board without parts. A PCBA is the board after the components are soldered on, so it can work as an electronic circuit.',k:'pcb pcba difference bare board'},
{c:'Basics',q:'What is the difference between SMT and THT?',a:'SMT parts sit on the surface and are soldered to pads. THT parts have leads that go through holes and are soldered on the other side. SMT is smaller and faster. THT is stronger for heavy or large parts.',k:'smt tht through hole surface mount'},
{c:'Basics',q:'Why are some boards processed on both sides?',a:'More parts fit on a smaller board. The first side is soldered and then the board is flipped for the second side. Heavy parts go on the first side or are glued so they do not fall off in the second reflow.',k:'double sided top bottom flip'},
{c:'Basics',q:'What is IPC-A-610?',a:'It is the acceptance standard for electronic assemblies with pictures of acceptable and unacceptable joints. Class 1 is general electronics, Class 2 is dedicated service electronics and Class 3 is high reliability, such as medical or aerospace.',k:'ipc standard class 1 2 3 acceptance'},
{c:'Basics',q:'What is a golden board?',a:'A known good board used as a reference to train and check inspection machines and to compare with problem boards.',k:'golden board reference sample'},
{c:'Materials',q:'Why is solder paste kept in a fridge?',a:'Cold storage slows the chemical changes of flux and the separation of solder balls from flux. Paste that is stored warm ages quickly and prints and reflows badly.',k:'paste storage refrigerator fridge cold shelf life'},
{c:'Materials',q:'Why must paste warm up before use?',a:'A cold jar attracts water from the air when opened. Moisture in paste causes solder balls, spatter and voids. Let it warm sealed at room temperature (often about 4 hours) and never heat it.',k:'paste warm up thaw condensation'},
{c:'Materials',q:'Can I reuse paste scraped off the stencil?',a:'Follow your procedure. Many factories allow limited mixing of used and fresh paste, within the paste open time, but never paste that is dry, stiff or past its time limit.',k:'reuse paste scraped used old'},
{c:'Materials',q:'What is the difference between lead-free and leaded solder?',a:'Lead-free solder (for example SAC305) melts at 217 °C and needs a hotter profile. Tin-lead (Sn63/Pb37) melts at 183 °C. RoHS rules require lead-free for most consumer products. Never mix the two materials in the same line without control.',k:'lead free leaded sac305 rohs tin lead'},
{c:'Materials',q:'What is flux and why is it needed?',a:'Flux cleans oxide from the pads and leads so molten solder can wet and bond. It also protects the metal while it heats.',k:'flux oxide wetting'},
{c:'Materials',q:'What does MSL mean and why do we bake components?',a:'MSL is the moisture sensitivity level of a part. After the sealed bag is opened, the part can only stay out for a limited floor life. If it exceeds that, moisture can turn to steam in the oven and crack the package (popcorning), so the part must be baked first.',k:'msl moisture bake popcorn floor life dry cabinet'},
{c:'Process',q:'Why do we need SPI if we have AOI?',a:'SPI checks the paste before parts are placed, when a bad print can be cleaned off in seconds. Most solder defects begin at printing, so finding them early saves large rework cost.',k:'spi aoi difference why paste inspection'},
{c:'Process',q:'What is a reflow profile?',a:'It is the temperature versus time curve the board sees in the oven: preheat, soak, reflow (peak) and cooling. It is measured with thermocouples and must match the solder paste and component limits.',k:'reflow profile temperature curve thermocouple'},
{c:'Process',q:'Why do some factories use nitrogen in reflow?',a:'Nitrogen lowers oxygen, so metal surfaces oxidise less and solder wets better. It is useful for fine-pitch and hard-to-solder boards but increases cost.',k:'nitrogen n2 reflow oxygen oxidation'},
{c:'Process',q:'What is a stencil and what thickness is common?',a:'A stencil is a thin stainless steel sheet with holes at each pad. Common thickness is 100 to 150 µm (0.1 to 0.15 mm). Thinner stencils are used for very fine pitch.',k:'stencil thickness micron aperture'},
{c:'Process',q:'What is area ratio?',a:'It is the aperture opening area divided by the area of the aperture walls. A value of at least 0.66 helps the paste release cleanly from the stencil.',k:'area ratio aspect ratio stencil release ipc-7525'},
{c:'Process',q:'What is the difference between a chip shooter and a multifunction placer?',a:'A chip shooter is very fast and places small chip parts. A multifunction (flexible) placer is slower but accurate and handles large, odd-shape and fine-pitch parts such as QFP, BGA and connectors.',k:'chip shooter mounter placer multifunction'},
{c:'Process',q:'What is first article inspection?',a:'It is a full check of the first board after a setup or changeover against the BOM and the drawing (part values, polarity, positions) before the full lot is run.',k:'first article fai changeover setup'},
{c:'Process',q:'Why is the underside of the stencil wiped?',a:'Paste squeezes out under the stencil and smears onto the board. Wiping prevents bridging, especially on fine-pitch parts.',k:'stencil wipe underside bridging'},
{c:'Process',q:'What is selective soldering?',a:'It is a through-hole soldering method that uses a small nozzle wave only at selected joints. It is used when the board has sensitive parts or is too complex for a full wave.',k:'selective soldering mini wave nozzle'},
{c:'Process',q:'Why use a pallet in wave soldering?',a:'A pallet (fixture) protects SMD parts on the bottom side from the molten solder and keeps the board flat.',k:'wave pallet fixture carrier'},
{c:'Process',q:'What is SMEMA?',a:'SMEMA is the signal standard that machines use to pass boards: one says "board available", the next says "machine ready".',k:'smema handshake conveyor signal'},
{c:'Inspection',q:'What is a false call and what is an escape?',a:'A false call is when inspection flags a good item as bad. An escape is when a real defect passes. You want both to be as low as possible, but escapes are more dangerous.',k:'false call escape aoi false reject'},
{c:'Inspection',q:'Why do BGA joints need X-ray?',a:'The joints are under the package. Cameras cannot see them, so X-ray is used to check bridges, opens, missing balls, voids and alignment.',k:'bga xray hidden joint'},
{c:'Inspection',q:'What is a void and when is it a problem?',a:'A void is a gas bubble in the solder joint. A few small voids are normal. Large voids (for example over 25 % of the ball area on BGA) reduce strength and heat transfer, especially for power parts.',k:'void bubble voiding limit'},
{c:'Inspection',q:'What is head-in-pillow?',a:'The BGA ball and the paste touch but do not merge into one joint. It often looks normal from the top and passes some tests, but fails later.',k:'head in pillow hip bga'},
{c:'Inspection',q:'What is the difference between AOI and FAOI?',a:'AOI is used inside the SMT line to check parts and solder joints. FAOI is the final optical inspection on the finished board after through-hole assembly, wave solder or press-fit and depaneling, and covers connectors, labels and damage.',k:'aoi faoi difference final inspection'},
{c:'Inspection',q:'What is the difference between ICT and FCT?',a:'ICT (in-circuit test) checks individual parts and joints electrically. FCT (functional test) checks that the whole board works as designed.',k:'ict fct test in circuit functional'},
{c:'Quality',q:'What does Cpk mean?',a:'Cpk shows how well a process fits inside its limits. A higher number means a more capable process. 1.33 or more is often used as the minimum target.',k:'cpk capability process spc'},
{c:'Quality',q:'What does containment mean?',a:'It is the immediate action to stop suspected bad product from moving forward: isolate, label, inspect and sort it, and check what has already moved on.',k:'containment action quarantine isolate'},
{c:'Quality',q:'What is the difference between corrective and preventive action?',a:'Corrective action removes the cause of a problem that has already happened. Preventive action stops similar problems from happening elsewhere.',k:'corrective preventive action capa'},
{c:'Quality',q:'What is 8D?',a:'It is a structured problem-solving method with eight steps: team, problem description, containment, root cause, corrective action, verification, prevention and closure.',k:'8d problem solving report'},
{c:'Quality',q:'How do I find out which defect to fix first?',a:'Count defects by type and rank them in a Pareto chart. Fixing the top one or two usually removes most of the problem.',k:'pareto top defect priority'},
{c:'Safety',q:'Is X-ray dangerous?',a:'X-ray equipment is shielded and interlocked, so under normal use exposure is very low. But never bypass interlocks, never open the cabinet while it is on, and follow your radiation safety training.',k:'xray safety radiation dangerous'},
{c:'Safety',q:'Why do we use ESD wrist straps?',a:'Static electricity can destroy sensitive parts without any visible sign. A wrist strap connects you to ground so you do not build up and discharge static.',k:'esd wrist strap static electricity'},
{c:'Safety',q:'Why does routing make dust and why is it a problem?',a:'The bit cuts through fibreglass and copper. The dust can cause shorts and corrosion if left on the board, and it irritates skin and lungs. Use vacuum and clean the boards.',k:'router dust cleaning contamination'},

var STOPW=new Set('what is the a an of to in on for and or how why do does can i we you my it are be with at by from this that about when which should please tell me explain'.split(' '));
var SYN={short:'bridge',shorts:'bridge',shorted:'bridge',tombstone:'tombstoning',pop:'popcorning',dirty:'contamination',dust:'contamination',cleaning:'contamination',bubble:'void',bubbles:'void',oven:'reflow',cut:'router',depanel:'router',depaneling:'router',tht:'throughhole',insertion:'auto',insert:'auto',hip:'headinpillow'};
var PH=[[/x[\s-]?ray/g,'xray'],[/press[\s-]?fit/g,'pressfit'],[/through[\s-]?hole/g,'throughhole'],[/lead[\s-]?free/g,'leadfree'],[/head[\s-]?in[\s-]?pillow/g,'headinpillow'],[/tin[\s-]?lead/g,'tinlead'],[/wave[\s-]?solder(ing)?/g,'wavesolder'],[/pick[\s-]?and[\s-]?place/g,'mounter'],[/solder[\s-]?paste/g,'solderpaste']];
function stem(t){if(t.length<=4)return t;t=t.replace(/(ing|ed|es|s)$/,'');return t.length>4?t.replace(/e$/,''):t}
function toks(s){
  s=s.toLowerCase();PH.forEach(function(p){s=s.replace(p[0],p[1])});
  return s.replace(/[^a-z0-9+ ]/g,' ').split(/\s+/).filter(function(t){return t&&!STOPW.has(t)}).map(function(t){return stem(SYN[t]||t)});
}
var IDX=null;
function buildIdx(){
  IDX=[];
  FAQ.forEach(function(f,i){IDX.push({ty:'faq',i:i,title:f.q,key:f.k,body:f.a})});
  LESSONS.forEach(function(l){IDX.push({ty:'lesson',id:l.id,title:l.n,key:l.tag+' '+l.id,body:l.what+' '+l.steps.join(' ')+' '+l.issues.map(function(x){return x.join(' ')}).join(' ')+' '+l.tips.join(' ')})});
  DEFECTS.forEach(function(d){IDX.push({ty:'defect',id:d.id,title:d.n,key:d.id,body:d.look+' '+d.fix.join(' ')+' '+d.contain.join(' ')+' '+d.causes.map(function(c){return c[1]}).join(' ')})});
  GLOSS.forEach(function(g){IDX.push({ty:'gloss',title:g[0],key:g[0],body:g[1]})});
  var df={};
  IDX.forEach(function(d){d.t=toks(d.title);d.k=toks(d.key||'');d.b=toks(d.body);var seen={};d.t.concat(d.k,d.b).forEach(function(w){if(!seen[w]){seen[w]=1;df[w]=(df[w]||0)+1}})});
  IDX.df=df;
}
function search(q){
  if(!IDX)buildIdx();var qt=toks(q);if(!qt.length)return [];
  var phrase=q.toLowerCase().trim(),N=IDX.length;
  var res=IDX.map(function(d){
    var s=0;
    qt.forEach(function(t){
      var w=Math.log(1+N/(1+(IDX.df[t]||0)));
      if(d.t.indexOf(t)>-1)s+=5*w;
      if(d.k.indexOf(t)>-1)s+=3*w;
      var c=0;d.b.forEach(function(x){if(x===t)c++});if(c)s+=Math.min(3,1+c*.25)*w*.6;
    });
    if(d.title.toLowerCase().indexOf(phrase)>-1)s+=8;
    if(d.ty==='faq')s+=1;
    return {d:d,s:s};
  }).sort(function(a,b){return b.s-a.s});
  var top=res[0]?res[0].s:0;
  return res.filter(function(x){return x.s>=4&&x.s>=top*.35}).slice(0,8).map(function(x){return x.d});
}

  var q=ui.gq.toLowerCase().trim(),list=GLOSS.filter(function(g){return !q||(g[0]+' '+g[1]).toLowerCase().indexOf(q)>-1});
  if(!list.length)return '<div class="empty">No terms found.</div>';
  var out='',last='';
  list.forEach(function(g){var L=g[0].charAt(0).toUpperCase();if(L!==last){out+='<div class="lt2">'+L+'</div>';last=L}out+='<div class="gl"><b>'+esc(g[0])+'</b><span>'+esc(g[1])+'</span></div>'});
  return out;
}

/* ---------- main render ---------- */
function render(){
  ['learn','line','faults','quiz','qa'].forEach(function(v){var b=$('tab-'+v);if(b)b.setAttribute('aria-selected',ui.tab===v)});
  if(ui.tab!=='line')stopPlay();
  var a=$('app');
  a.innerHTML=ui.tab==='learn'?renderLearn():ui.tab==='line'?renderLine():ui.tab==='faults'?renderFaults():ui.tab==='quiz'?renderQuiz():renderQA();
  if(ui.anim){a.classList.remove('enter');void a.offsetWidth;a.classList.add('enter');ui.anim=false}
}
function settingsSheet(){
  openSheet('<div class="edh"><button class="btn ghost sm" data-act="close">Close</button><span class="pill">About</span></div><h2>SMT Academy</h2><p class="help">A beginner’s guide to SMT and PCBA: 13 lessons, '+DEFECTS.length+' defects, '+QUIZ.length+' quiz questions, '+FAQ.length+' FAQs and '+GLOSS.length+' glossary terms. Your progress is saved on this phone only.</p><div class="warnbox">Typical values are examples for learning. Always follow your company procedures, datasheets, customer requirements and safety rules.</div><div class="row2"><button class="btn danger" data-act="reset">Reset my progress</button></div>');
}
var acts={
 tab:function(el){ui.tab=el.dataset.v;ui.anim=true;render();window.scrollTo(0,0)},
 close:closeSheet,settings:settingsSheet,basics:basicsSheet,
 lesson:function(el){lessonSheet(el.dataset.id)},
 learned:function(el){var id=el.dataset.id;P.learned[id]=!P.learned[id];if(!P.learned[id])delete P.learned[id];save();lessonSheet(id);toast(P.learned[id]?'Marked as learned ✓':'Marked as not learned')},
 defect:function(el){defectSheet(el.dataset.id)},
 defView:function(el){ui.defView=el.dataset.v;render()},
 defF:function(el){ui.defF=el.dataset.v;render()},
 qaView:function(el){ui.qaView=el.dataset.v;render()},
 sug:function(el){ui.ask=el.dataset.q;render();var r=$('qres');if(r&&r.scrollIntoView)r.scrollIntoView({behavior:'smooth',block:'start'})},
 lineGo:function(el){stopPlay();ui.lineStep=+el.dataset.i;render()},
 linePrev:function(){stopPlay();ui.lineStep=Math.max(0,ui.lineStep-1);render()},
 lineNext:function(){stopPlay();ui.lineStep=Math.min(LESSONS.length-1,ui.lineStep+1);render()},
 linePlay:function(){
  if(ui.play){stopPlay();render();return}
  if(ui.lineStep>=LESSONS.length-1)ui.lineStep=0;
  ui.play=setInterval(function(){if(ui.lineStep>=LESSONS.length-1){stopPlay();render();return}ui.lineStep++;render()},2600);render();
 },
 quiz:function(el){startQuiz(el.dataset.m,el.dataset.t)},
 quizTopic:function(el){startQuiz('topic',el.dataset.t)},
 quizHome:function(){ui.quiz=null;render()},
 pick:function(el){pickAns(+el.dataset.i)},
 qnext:function(){var Q=ui.quiz;Q.n++;Q.picked=null;if(Q.n>=Q.list.length){Q.best=Math.max(Q.best||0,Q.streak)}render();window.scrollTo(0,0)},
 reset:function(el){if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='Tap again to reset';return}P.learned={};P.quiz={ans:0,ok:0,by:{},wrong:[],best:0};P.seen={};save();ui.quiz=null;closeSheet();toast('Progress reset')}
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var f=acts[el.dataset.act];if(f){f(el);if(['learned','reset','pick'].indexOf(el.dataset.act)<0&&!/^(tab|close|settings|basics|lesson|defect|quiz|quizTopic|quizHome|qnext|lineGo|linePrev|lineNext|linePlay|defView|defF|qaView|sug)$/.test(el.dataset.act))save()}});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='dq'){ui.defQ=t.value;$('dlist').innerHTML=defList()}
  else if(t.id==='ask'){ui.ask=t.value;$('qres').innerHTML=qaBody()}
  else if(t.id==='gq'){ui.gq=t.value;$('glist').innerHTML=glList()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
document.addEventListener('visibilitychange',function(){if(document.hidden)stopPlay()});

load();
if(ui.tab==='learn'&&false)render();
render();
})();

</script>
</body>
</html>
