<style>
:root{
  --ink:#0C2B2E; --muted:#51696C; --on-ink:#FFFFFF;
  --surface:rgba(255,255,255,.78); --solid:#FFFFFF; --line:rgba(12,43,46,.14);
  --green:#0E9F6E; --teal:#0891B2; --copper:#E0922F; --copper-ink:#3F2600; --coral:#F25C54;
  --danger:#E5484D; --ok:#12A383;
  --shadow:0 14px 30px -16px rgba(12,43,46,.5);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{--ink:#E6FFF8; --muted:#97B8B3; --on-ink:#062622;--surface:rgba(8,44,48,.74);--solid:#0F3B3F;--line:rgba(230,255,248,.15);--copper-ink:#2E1B00;--danger:#FF7378;--ok:#3EDDB0;--shadow:0 14px 30px -16px rgba(0,0,0,.8)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:'IBM Plex Sans',-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.45}
html{background:#DDF3EC}
@media (prefers-color-scheme: dark){html{background:#061D1F}}
body{min-height:100vh;padding-bottom:120px}
h1,h2,h3{font-family:'Space Grotesk','IBM Plex Sans',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
code{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:540px;margin:0 auto;padding:12px 16px}
.muted{color:var(--muted)}

/* background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg svg{position:absolute;inset:0;width:100%;height:100%}
.bg .night{display:none}
@media (prefers-color-scheme: dark){.bg .day{display:none}.bg .night{display:block}}
.pulse{fill:none;stroke-linecap:round;stroke-dasharray:14 520;animation:run 7s linear infinite}
.pulse.p2{animation-duration:9s;animation-delay:-3s}.pulse.p3{animation-duration:11s;animation-delay:-6s}.pulse.p4{animation-duration:8s;animation-delay:-2s}
@keyframes run{to{stroke-dashoffset:-534}}
.glow{animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35}to{opacity:.9}}

/* top / common */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:6px 2px 14px}
.ttl h1{font-size:30px;line-height:1.08;font-weight:700}
.ttl p{margin:5px 0 0;color:var(--muted);font-size:14px;font-weight:500}
.gear{flex:0 0 44px;height:44px;border-radius:15px;background:var(--surface);border:1px solid var(--line);font-size:19px;box-shadow:0 2px 0 var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.shead{margin:20px 2px 8px}.shead h2{font-size:19px}.shead p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.card{display:block;background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.card h3{font-size:16.5px;margin-bottom:8px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,transparent);white-space:nowrap}
.btn{background:var(--ink);color:var(--on-ink);border-radius:15px;padding:12px 16px;font-weight:700;box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn.rose{background:linear-gradient(135deg,#10B981,#0891B2);color:#fff;box-shadow:0 3px 0 #0A6D6B}
.btn.gold{background:var(--copper);color:var(--copper-ink);box-shadow:0 3px 0 #A86A18}
.btn.ghost{background:var(--solid);border:1.5px solid var(--line);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.btn.danger{background:var(--solid);border:1.5px solid var(--danger);color:var(--danger)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.full{width:100%;margin-top:10px}
.btn:active{transform:translateY(2px);box-shadow:none}
.row2{display:flex;gap:10px;margin-top:12px}.row2 .btn{flex:1}
.inp{width:100%;background:color-mix(in srgb,var(--ink) 5%,var(--solid));border:1.5px solid var(--line);border-radius:15px;padding:13px 15px;font-size:16px}
.inp:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 22%,transparent)}
.help{color:var(--muted);margin:0 0 10px;font-size:13.5px}
.disc{color:var(--muted);font-size:12.5px;text-align:center;margin:18px 8px 0}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:24px;padding:24px;text-align:center;color:var(--muted)}.eb{font-size:40px}
.chipsx{display:flex;flex-wrap:wrap;gap:6px}
.chipsx button{background:var(--solid);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.seg{display:flex;gap:4px;background:color-mix(in srgb,var(--ink) 8%,transparent);padding:3px;border-radius:14px;margin:6px 0 12px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.cats{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 6px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13.5px;white-space:nowrap}
.cat[aria-pressed="true"]{background:linear-gradient(135deg,#10B981,#0891B2);color:#fff;border-color:transparent}
.srch{margin-bottom:10px}

/* hero */
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--green) 22%,var(--surface)),color-mix(in srgb,var(--copper) 18%,var(--surface)));border:1px solid var(--line);border-radius:28px;padding:16px;box-shadow:var(--shadow)}
.hr{position:relative;flex:0 0 96px;height:96px}.rsv{width:100%;height:100%}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.rc b{font-family:'Space Grotesk',sans-serif;font-size:23px;line-height:1}.rc small{color:var(--muted);font-size:11.5px}
.hi h2{font-size:20px;margin-bottom:4px}.hi p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:13px;margin-top:12px;box-shadow:var(--shadow)}
.oe{flex:0 0 48px;height:48px;border-radius:16px;background:color-mix(in srgb,var(--green) 18%,transparent);display:grid;place-items:center;font-size:24px}
.opt b{display:block;font-family:'Space Grotesk',sans-serif;font-size:16px}.opt small{color:var(--muted);font-size:13px}
.lc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.lc.done{border-color:color-mix(in srgb,var(--ok) 60%,transparent)}
.ln{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;display:grid;place-items:center}
.le{flex:0 0 44px;height:44px;border-radius:15px;background:color-mix(in srgb,var(--green) 16%,transparent);display:grid;place-items:center;font-size:22px}
.le.big{width:72px;height:72px;flex-basis:72px;font-size:36px;border-radius:24px;margin:0 auto 8px}
.lt{flex:1;min-width:0}.lt b{display:block;font-size:15px;font-weight:600}.lt small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk{flex:0 0 22px;text-align:center;font-weight:800;color:var(--muted);font-size:18px}.lc.done .lk{color:var(--ok)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:10px 4px;text-align:center;opacity:.5;filter:grayscale(1)}
.bd.on{opacity:1;filter:none;border-style:solid;border-color:color-mix(in srgb,var(--copper) 60%,transparent)}
.bd span{font-size:26px;display:block}.bd small{font-size:11.5px;font-weight:600}

/* lesson sheet */
.lhead{text-align:center;margin-bottom:8px}.lhead h2{font-size:23px}
.analogy{background:color-mix(in srgb,var(--copper) 24%,var(--solid));border:1px solid color-mix(in srgb,var(--copper) 55%,transparent);border-radius:18px;padding:12px 14px;font-size:14.5px;margin:10px 0}
details.acc{background:color-mix(in srgb,var(--ink) 4%,var(--solid));border:1px solid var(--line);border-radius:18px;margin-top:10px;overflow:hidden}
details.acc summary{display:flex;align-items:center;gap:10px;padding:13px 14px;font-weight:700;cursor:pointer;list-style:none;font-size:15px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:'›';margin-left:auto;font-size:20px;transition:transform .2s;color:var(--muted)}
details.acc[open] summary::after{transform:rotate(90deg)}
details.acc summary span{font-size:18px}
.ab{padding:0 14px 14px;font-size:14.5px}.ab p{margin:0 0 8px}
.ul,.ol{margin:0;padding-left:20px}.ul li,.ol li{margin:6px 0}
.ol{counter-reset:s;list-style:none;padding-left:0}.ol li{counter-increment:s;position:relative;padding-left:34px;margin:10px 0}
.ol li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#10B981,#0891B2);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.prow{padding:9px 0;border-bottom:1px dashed var(--line)}.prow:last-child{border:0}
.prow b{display:block}.prow code{display:block;color:var(--green);font-size:13px;font-weight:600;margin:2px 0}.prow small{color:var(--muted);font-size:12.5px}
.isu{padding:10px 12px;margin-top:8px;background:var(--solid);border:1px solid var(--line);border-radius:14px;font-size:13.5px}.isu b{display:block;margin-bottom:3px}.isu i{font-style:normal;font-weight:700;color:var(--muted)}
.dg{width:100%;height:auto;font:600 9px 'IBM Plex Sans',sans-serif;fill:currentColor;color:var(--ink)}
.dgc{padding:10px}
.whys{display:grid;gap:6px;margin:8px 0}.why{display:flex;gap:10px;align-items:flex-start;background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.why b{flex:0 0 auto;background:var(--copper);color:var(--copper-ink);border-radius:8px;padding:1px 8px;font-size:12px}.why span{font-size:13.5px}

/* line */
.belt{display:flex;align-items:center;gap:2px;overflow-x:auto;padding:4px 16px 10px;margin:0 -16px;scrollbar-width:none}.belt::-webkit-scrollbar{display:none}
.st{flex:0 0 66px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line)}
.st span{font-size:22px}.st small{font-size:10.5px;font-weight:600;line-height:1.1;text-align:center;color:var(--muted)}
.st.on{border-color:var(--copper);background:color-mix(in srgb,var(--copper) 26%,var(--solid));transform:translateY(-3px)}.st.on small{color:var(--ink)}
.st.past{border-color:color-mix(in srgb,var(--green) 55%,transparent)}
.ar{color:var(--muted);font-weight:800;font-style:normal}
.journey h3{font-size:19px;margin:2px 0 6px}.journey p{margin:0 0 6px;font-size:15px}
.jb{height:34px;margin-bottom:8px;position:relative}
.jb::before{content:'';position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 16px)}
.jboard{position:absolute;top:6px;left:var(--x);transform:translateX(calc(var(--x) * -1));width:42px;height:22px;transition:left .6s ease,transform .6s ease}
.jboard i{display:block;width:100%;height:100%;border-radius:4px;background:#0E9F6E;border:2px solid #0A7A55;box-shadow:inset 6px 6px 0 -3px #E0922F,inset -8px -4px 0 -3px #1E293B}
.gate{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.gate:last-child{border:0}.gate b{flex:0 0 86px;font-family:'Space Grotesk',sans-serif;color:var(--green)}.gate span{color:var(--muted)}

/* defects */
.dc,.rs{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.de{flex:0 0 44px;height:44px;border-radius:15px;background:color-mix(in srgb,var(--coral) 14%,transparent);display:grid;place-items:center;font-size:22px}
.dt{flex:1;min-width:0}.dt b{display:block;font-size:15px}.dt small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.s1{background:color-mix(in srgb,var(--ok) 25%,transparent)}.s2{background:color-mix(in srgb,var(--copper) 35%,transparent)}.s3{background:color-mix(in srgb,var(--danger) 28%,transparent)}
.meta2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.meta2 small{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.cz{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:14px}
.tg{flex:0 0 auto;display:inline-block;background:var(--ink);color:var(--on-ink);border-radius:8px;padding:1px 8px;font-size:11.5px;font-weight:700;margin-bottom:6px}
.cz .tg{margin:2px 0 0}
.card.act{border-left:6px solid var(--green)}.card.cor{border-left-color:var(--ok)}.card.pre{border-left-color:var(--teal)}.card.con{border-left-color:var(--copper)}

/* quiz */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 4px;text-align:center}.stats b{display:block;font-family:'Space Grotesk',sans-serif;font-size:24px}.stats small{color:var(--muted);font-size:12px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}.tcard b{font-size:14px}.tcard small{color:var(--muted);font-size:12px}
.meter{height:8px;width:100%;background:color-mix(in srgb,var(--ink) 10%,transparent);border-radius:99px;overflow:hidden;margin:4px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,#10B981,#F59E0B);border-radius:99px;transition:width .4s}
.qtop{display:flex;align-items:center;gap:10px;margin:6px 0 4px}.qtop .meter{flex:1}
.qcard h2{font-size:20px;line-height:1.3;margin:6px 0 12px}
.opts{display:grid;gap:8px}
.qo{display:flex;align-items:center;gap:10px;text-align:left;background:var(--solid);border:2px solid var(--line);border-radius:16px;padding:12px;font-size:15px;font-weight:500}
.qo span{flex:0 0 28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--ink) 10%,transparent);display:grid;place-items:center;font-weight:700;font-size:13px}
.qo.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--solid))}.qo.ok span{background:var(--ok);color:#fff}
.qo.no{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 16%,var(--solid))}.qo.no span{background:var(--danger);color:#fff}
.qo.dim{opacity:.5}
.fb{margin-top:12px;border-radius:16px;padding:12px 14px;font-size:14.5px}.fb p{margin:4px 0 0}
.fb.good{background:color-mix(in srgb,var(--ok) 18%,var(--solid))}.fb.bad{background:color-mix(in srgb,var(--danger) 14%,var(--solid))}

/* q&a */
.askb .inp{font-size:16.5px;padding:15px 16px}
.sug{margin:0 0 12px}
.gl{padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:6px}.gl b{display:block;font-family:'Space Grotesk',sans-serif;color:var(--green)}.gl span{font-size:14px}
.lt2{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--copper);margin:14px 4px 6px;font-size:18px}
.warnbox{background:color-mix(in srgb,var(--copper) 24%,var(--solid));border:1.5px solid color-mix(in srgb,var(--copper) 70%,transparent);border-radius:16px;padding:11px 14px;margin:10px 0;font-weight:600;font-size:14px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:10}
.tabs{pointer-events:auto;display:flex;justify-content:space-between;width:100%;max-width:520px;background:rgba(255,255,255,.93);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line);border-radius:28px;padding:7px;box-shadow:0 16px 34px -14px rgba(12,43,46,.55)}
@media (prefers-color-scheme: dark){.tabs{background:rgba(10,52,56,.94)}}
.tabs button.t{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:20px;font-size:10.5px;font-weight:700;color:var(--muted)}
.tabs button.t svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.t[aria-selected="true"]{color:var(--ink);background:color-mix(in srgb,var(--green) 22%,transparent)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(2,24,26,.58);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;z-index:20}.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;justify-content:center;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.25,1)}.sheet.on{transform:none}
.sheet-in{background:var(--solid);width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:10px 18px calc(28px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow-y:auto;overscroll-behavior:contain;border-top:6px solid var(--green)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.edh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet h2{font-size:23px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--ink);color:var(--on-ink);padding:12px 20px;border-radius:99px;font-weight:700;z-index:50;transition:transform .35s cubic-bezier(.2,.9,.25,1);max-width:90%;text-align:center}.toast.on{transform:translate(-50%,0)}
#app.enter>*{animation:rise .45s cubic-bezier(.2,.9,.25,1) both}#app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}#app.enter>*:nth-child(n+4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>

<script>
var LESSONS=[
{id:'loader',n:'PCB Loader',e:'📥',grp:'smt',tag:'Feeds bare boards into the line one by one',
 analogy:'Like the tray return at a food court feeding plates onto a belt: it hands boards to the line at a steady rhythm.',
 what:'The loader holds bare printed circuit boards (PCBs) in magazines or racks and pushes them one at a time onto the conveyor that leads to the printer. It is the first machine of the SMT line, so mistakes made here (wrong board, wrong side up, damaged board) travel through the whole line.',
 where:'Start of the SMT line, before the solder paste printer. (An unloader does the opposite job at the end of the line.)',
 steps:[
 'Check the work order, board part number and revision against the routing sheet.',
 'Inspect the bare boards: no warpage, scratches, dirt, moisture stains or broken tooling holes. Check the date code. Boards stored for a long time may need baking, as the PCB supplier specifies.',
 'Load boards into the magazine with the correct side up (top or bottom) and the correct direction (fiducial or notch position).',
 'Set the conveyor width to the board width, leaving about 1 mm of clearance, and select the board program.',
 'Place the magazine on the loader. The lifter positions the first board and a pusher slides it onto the conveyor.',
 'A sensor confirms the board. The machine sends a "board available" signal (SMEMA) and the next machine answers "machine ready".',
 'A barcode or QR code on the board may be scanned so the board is tracked (traceability) through the whole process.',
 'When a magazine is empty it is exchanged for a full one without stopping the line.'],
 params:[['Conveyor width','Board width + about 1 mm','Too tight causes jams, too loose lets the board skew'],['Magazine pitch','Matches the slot spacing','Wrong pitch causes double feed or missed boards'],['Pusher speed','Slow and smooth','A fast push can bounce or scratch boards'],['Board orientation','As the work instruction says','Wrong side up can scrap a whole batch'],['SMEMA handshake','Ready and available signals','How machines pass boards safely']],
 issues:[
 ['Board jams at the entry','Width set too narrow, warped board or dirty rail','Reset the width, remove the board with gloves, check board flatness, clean the rails'],
 ['Two boards pushed together (double feed)','Worn magazine slots or wrong pitch setting','Replace the magazine and check the pitch setting'],
 ['Scratches on the board','Rough rails, debris, boards rubbing in the magazine','Clean or replace the rails, use proper magazines, hold boards by the edges'],
 ['Board loaded wrong side up','No orientation mark, operator error','Mark the magazine, do a first-board check, use side detection or barcode'],
 ['Dust or fingerprints on pads','Bare hands, dusty area, open storage','Wear gloves, use a PCB surface cleaner, keep boards covered']],
 checks:['Rails clean and dry, conveyor moves freely','Sensors and E-stop working','Magazines not bent or cracked','Board part number and revision match the work order'],
 safety:['Keep hands out of the lifter and pusher area. It is a pinch point.','Wear an ESD wrist strap and hold boards by the edges.'],
 tips:['Always do a first-board check: part number, revision, direction and visible fiducials.','Moisture matters. Boards stored open for a long time can absorb water and blister during reflow.'],
 defects:[]},

{id:'printer',n:'Solder Paste Printer',e:'🖨️',grp:'smt',tag:'Prints solder paste on the pads through a stencil',
 analogy:'Like screen-printing a T-shirt. The stencil is the screen, the paste is the ink and the squeegee spreads it. Paste must land only on the pads, in the right amount.',
 what:'The printer pushes solder paste (tiny solder balls mixed with flux) through holes (apertures) in a thin metal stencil onto the copper pads of the PCB. The paste holds the components in place and later melts into the solder joint. Printing is the most important SMT step: most soldering defects are often traced back to it (a common rule of thumb says 60 to 70%).',
 where:'After the loader and before SPI.',
 steps:[
 'Prepare the paste: take it from the fridge (about 0 to 10 °C), let the sealed jar warm up to room temperature for about 4 hours (follow the datasheet) and never heat it. Write the open time on the jar.',
 'Mount the correct stencil (part number, revision, side). Check that it is clean and tight in the frame.',
 'Add paste in front of the squeegee: a roll about the length of the print area and about 1 to 2 cm thick.',
 'The board enters, is lifted on support pins or blocks so it is flat, and is clamped at the edges.',
 'Cameras find the board fiducials and the stencil fiducials and align them (X, Y and rotation).',
 'The stencil touches the board. The squeegee moves across at the set pressure, angle (about 60°) and speed and fills the apertures.',
 'Separation: board and stencil separate slowly so the paste releases cleanly from the apertures.',
 'Underside wipe: every few prints the underside of the stencil is wiped to stop smear and bridging.',
 'The board moves on to SPI. Check the first print before releasing the lot.'],
 params:[['Squeegee pressure','Just enough to wipe the stencil clean','Too high scoops paste, too low skips'],['Print speed','About 20 to 80 mm/s','Too fast fills badly, too slow causes slump or smear'],['Separation speed','Slow (start around 0.5 to 3 mm/s)','Fast separation makes peaks and dog-ears'],['Wipe frequency','Every 1 to 10 prints, depends on product','Prevents bridging'],['Stencil thickness','100 to 150 µm typical','Sets the paste volume'],['Room','20 to 26 °C and 40 to 60 %RH','Paste dries or absorbs water outside this range'],['Paste time on stencil','Replace as the datasheet says (often 4 to 8 h)','Old paste loses tack and wets badly']],
 issues:[
 ['Insufficient paste or skipped pads','Clogged apertures, low pressure, dried paste','Clean the stencil, wipe more often, add fresh paste, check the pressure'],
 ['Bridging between pads','Too much paste, smear under the stencil, poor board support','Wipe the stencil, lower the pressure, check the support and the stencil gap'],
 ['Print misaligned (offset)','Fiducials not recognised, wrong stencil revision, bad calibration','Clean the fiducials, recalibrate the alignment, check the stencil number'],
 ['Peaks or dog-ears after separation','Separation too fast, rough aperture walls','Slow the separation, replace the stencil'],
 ['Slump (paste spreads out)','Heat or humidity, wrong paste, paste too long on stencil','Control the room, use fresh paste']],
 checks:['Stencil clean and not damaged, correct number and revision','Squeegee blades straight, not nicked','Paste lot, expiry and open time recorded','Support pins set for this board','Room temperature and humidity in range'],
 safety:['Wear gloves. Paste contains flux and metals. Do not eat or drink near it.','Keep fingers out of the squeegee and stencil area. Clean with approved cleaner (such as IPA) in a ventilated area, away from ignition sources.'],
 tips:['Good paste rolls in front of the squeegee. If it only slides, it is too dry or the speed is wrong.','Design rule for stencils: area ratio ≥ 0.66 and aspect ratio ≥ 1.5 give clean paste release (IPC-7525).','Never mix old scraped paste back into a new jar unless your procedure allows it.'],
 diagram:'printer',defects:['insufficient','excess','bridge','smear','slump','pasteoffset']},

{id:'spi',n:'SPI (Solder Paste Inspection)',e:'📏',grp:'smt',tag:'Measures paste volume, height and position on every pad',
 analogy:'Like checking the icing on cupcakes with a ruler before baking. If it is wrong, wipe it off and redo it. Nothing is baked yet, so fixing is cheap.',
 what:'SPI uses a 3D sensor (laser or structured light) to measure every paste deposit: height, area, volume, shape and offset compared with the pad. It stops bad boards before parts are placed, because cleaning off paste takes seconds but repairing a soldered board takes minutes. SPI data can also be sent back to the printer (closed loop) to correct drift.',
 where:'After the printer and before the mounter.',
 steps:[
 'Load the program for the board (pad data from Gerber or CAD, with the stencil thickness).',
 'The camera finds the fiducials. Board warp is measured and compensated.',
 'The sensor scans the board and calculates height, area and volume for every deposit.',
 'The software compares each value with limits (for example volume 70 to 130 %, offset ≤ 25 to 30 % of the pad).',
 'Passing boards continue. Failing boards stop or go to a review screen.',
 'The operator looks at the 2D and 3D picture and decides: real defect or false call.',
 'For real defects the board is removed, cleaned and reprinted (follow your rework rule) and the printer is checked.',
 'SPC charts and Cpk are watched so slow drift is caught before it becomes a defect.'],
 params:[['Volume limit','Often 50 to 150 % (tight: 70 to 130 %)','The most important number'],['Height limit','About ±20 to 30 % of the stencil thickness','Finds thick or thin paste'],['Area limit','About 70 to 130 % of the aperture','Finds smear and clogging'],['Offset','≤ 25 to 50 % of the pad','Finds misprints'],['Bridge check','Gap between neighbouring deposits','Finds shorts early'],['Calibration','With a height standard or gauge block','Keeps measurements true']],
 issues:[
 ['Many false fails','Shiny or dirty pads, warped board, limits too tight, shadows','Clean the lens, check board support, tune limits with real data (never just widen limits to hide a problem)'],
 ['Real insufficient volume','Clogged apertures, low paste','Wipe or clean the stencil, add paste'],
 ['The same pad fails on every board','Aperture blocked or worn','Clean or replace the stencil'],
 ['Volume slowly trending down','Paste drying, squeegee worn','Replace paste, check the squeegee'],
 ['SPI passes but AOI finds shorts','Limits too loose, bridge test off','Review the limits and the bridge settings']],
 checks:['Lens clean, covers closed','Calibration valid (gauge block check)','Correct program and stencil thickness entered','Review station shows both 2D and 3D images'],
 safety:['Some SPI machines use a laser. Never look into laser light and keep covers closed.'],
 tips:['Fix the printer, not the SPI. SPI is only the messenger.','Prove the SPI measures well with a Gauge R&R study.'],
 defects:['insufficient','excess','bridge','pasteoffset','smear']},

{id:'mounter',n:'Mounter (Pick-and-Place)',e:'🤖',grp:'smt',tag:'Places every component onto the paste',
 analogy:'A very fast robot with vacuum tweezers. It picks tiny parts from reels and places them on the exact spot, up to tens of thousands per hour.',
 what:'The mounter takes SMD components from feeders (tape reels, trays, tubes), picks them with vacuum nozzles, checks them with a camera and places them on the pasted pads with the right position, rotation and polarity. Fast "chip shooters" place small chips. Flexible placers place large and fine-pitch parts such as QFP, BGA and connectors.',
 where:'After SPI and before reflow. Often 2 to 4 mounters work in series.',
 steps:[
 'Load the program (placement list with X, Y, rotation and part number) and check that the BOM revision is correct.',
 'Set up feeders with the right reels in the right slots. Scan barcodes so the machine checks the part number against the program.',
 'The camera reads the board fiducials to correct board position and stretch.',
 'The head moves over a feeder and the nozzle lowers and picks the part with vacuum.',
 'An up-looking camera checks the part (size, shape, pick offset, leads). Bad parts go to the discard box.',
 'The head corrects angle and offset, moves to the board and presses the part gently into the paste.',
 'This repeats for every part. The board then moves on to the next mounter or to AOI.',
 'First article inspection: after a changeover, check the first board against the BOM and drawing (values, polarity, position) before running the lot.',
 'Replace reels before they run out. Splice carefully and scan every new reel.'],
 params:[['Nozzle size','Matches part size and shape','Wrong nozzle causes pick errors'],['Vacuum level','Within machine specification','Weak vacuum drops parts'],['Placement height or force','Slightly into the paste, not through it','Too hard squeezes paste out or cracks parts'],['Placement accuracy','Chips about ±0.05 mm, fine pitch about ±0.03 mm (machine dependent)','Needed for small pads'],['Part data','Correct size, height and polarity mark','Wrong data causes rejects or misplacement'],['Moisture-sensitive parts','Track floor life','Prevents popcorning']],
 issues:[
 ['Missing parts','Worn or clogged nozzle, feeder misfeed, low vacuum','Clean or replace the nozzle, check the feeder pitch and tape, check the vacuum'],
 ['Wrong part placed','Wrong or mixed reel loaded','Scan barcodes at setup, use a second-person check'],
 ['Reversed polarity','Wrong rotation in the program or the library','Check the library data, do a first article check'],
 ['Part shifted or rotated','Poor fiducial reading, board vibration, bad support','Clean fiducials, check support, recalibrate'],
 ['Tombstone or billboarding','Part picked on its edge or the wrong nozzle','Check the pick position and the nozzle'],
 ['Cracked or damaged part','Too much force or wrong part height data','Correct the part height, lower the force']],
 checks:['Nozzles clean and not worn, correct nozzle for each part','Feeders clean and not bent, tape advancing properly','Vacuum in range','Program and BOM revisions match','All reels scanned and verified'],
 safety:['Never put hands in the machine while it is running. Use the door interlocks.','Handle nozzles and reels with ESD care.'],
 tips:['Most mounter defects begin at setup or at a reel change. Be slow and scan everything.','Dust causes most pick failures. Keep nozzles and feeders clean.'],
 defects:['missing','wrongpart','polarity','shift','billboard','tombstone','crack']},

{id:'aoi',n:'AOI (Automated Optical Inspection)',e:'👁️',grp:'smt',tag:'Cameras check parts and solder joints automatically',
 analogy:'A tireless inspector with many cameras and coloured lights who compares every board with a "golden" example.',
 what:'AOI takes pictures of the board with coloured light from several angles and compares them with a stored model. Pre-reflow AOI (after the mounter) checks presence, position and polarity while the paste is still wet and mistakes are easy to fix. Post-reflow AOI checks the finished solder joints (shape, bridges, lifted leads) and the parts again. AOI cannot see under parts such as BGA, so those need X-ray.',
 where:'After the mounter (pre-reflow), after the reflow oven (post-reflow), or both.',
 steps:[
 'Load the program and the part library for the board.',
 'The board enters. The camera finds the fiducials and corrects the position.',
 'The head scans the board while the lighting changes (top, side, red, green and blue rings) to show shape and colour.',
 'The software checks each part: presence, offset, rotation, polarity mark, printed text (OCR), colour and solder fillet shape.',
 'PASS boards move on. FAIL boards go to the verify station, where the operator sees the picture and confirms.',
 'Confirmed defects go to repair with a defect code and location. False calls are released.',
 'Defect data is recorded (type, location, machine, feeder) so engineers can find the cause.',
 'The program is tuned using the false call rate and the escape rate.'],
 params:[['Presence or absence','Pad area contrast','Finds missing parts'],['Offset limit','Often ≤ 25 to 50 % of pad or lead width','Checks placement'],['Polarity','Marking read by OCR or colour','Finds reversed parts'],['Solder joint','Fillet shape from colour gradient','Finds insufficient solder, bridges, lifted leads'],['Lighting','Stable, covers closed','Changing light causes false calls'],['False call vs escape','Aim for few false calls and zero escapes','An escape is a defect that passed']],
 issues:[
 ['Too many false calls','Limits too tight, dirty lens, new supplier part with different colour','Tune the program with real data, clean the lens, update the library'],
 ['Defects pass (escapes)','Limits too loose, shadows, missing inspection window','Add the window, check the golden board, review against the line data'],
 ['Wrong value not detected','AOI reads colour and text, not electrical value','Rely on setup checks (BOM verification) and ICT or LCR test'],
 ['Lifted lead reported on a QFP','Coplanarity problem or poor solder','Check under a microscope, review the mounter and the reflow']],
 checks:['Lens and light clean, covers closed','Golden board check passes each shift','Correct program loaded','False call and escape counts reviewed'],
 safety:['The gantry moves. Keep hands clear and use covers. Follow ESD rules.'],
 tips:['AOI before reflow saves money. A shifted part is fixed in seconds.','Three identical fails in a row? Look upstream, not at the AOI.'],
 defects:['missing','wrongpart','polarity','shift','tombstone','bridge','insufficient','lifted','billboard']},

{id:'reflow',n:'Reflow Oven',e:'🔥',grp:'smt',tag:'Melts the paste into solder joints using a heat recipe',
 analogy:'Like baking a cake from a recipe. Temperature over time (the profile) must be right. Too hot burns it and too cool leaves it raw.',
 what:'The reflow oven carries the board through several heated zones on a conveyor. Hot air heats the board and parts gradually, activates the flux, melts the solder, lets it wet the pads and leads, and then cools it into strong joints. The temperature-versus-time recipe is the reflow profile. It depends on the solder paste and the most sensitive component.',
 where:'After the mounter (or pre-reflow AOI) and before post-reflow AOI.',
 steps:[
 'Select the recipe (zone temperatures and conveyor speed) for the product.',
 'Check that all zones have reached their set temperature, the conveyor speed and rail width are right, and the exhaust and airflow are on.',
 'Verify the profile with a profiler. Thermocouples are attached to the board (on cold spots and hot spots) and run through the oven. Read the curve.',
 'Preheat (ramp): temperature rises slowly, about 1 to 3 °C per second, so parts do not crack and solvents escape.',
 'Soak: about 150 to 200 °C for 60 to 120 seconds. Flux cleans oxides and big and small parts reach similar temperatures.',
 'Reflow (peak): the temperature passes the melting point (SAC305 melts at 217 °C) and peaks around 235 to 250 °C. Time above liquidus (TAL) is about 45 to 90 s. Solder melts, wets and pulls parts into alignment.',
 'Cooling: temperature falls about 2 to 4 °C per second (maximum about 6 °C/s) to freeze shiny, fine-grain joints.',
 'Boards leave the oven and cool before handling. Never stack hot boards.',
 'Keep records of profile checks (per shift or product change) and oven maintenance.'],
 params:[['Ramp rate','≤ 3 °C/s typical','Protects parts, avoids spatter'],['Soak','150 to 200 °C for 60 to 120 s','Flux activation, equal temperature'],['Time above liquidus','About 45 to 90 s above 217 °C (SAC305)','Good wetting without damage'],['Peak temperature','About 235 to 250 °C, never above the weakest part (often 260 °C)','Melts solder'],['Cooling rate','≤ 4 to 6 °C/s','Shiny joints, fewer cracks'],['Nitrogen (optional)','Oxygen about 1000 to 3000 ppm','Better wetting, less oxidation'],['Leaded solder (Sn63/Pb37)','Melts at 183 °C, peak about 205 to 225 °C','Different profile from lead-free']],
 issues:[
 ['Tombstoning','One pad heats or wets earlier, unbalanced paste, fast ramp','Slow the ramp, check paste volume balance and placement'],
 ['Solder balls','Preheat too fast (spatter), moist or old paste','Reduce the ramp rate, use fresh paste, check humidity'],
 ['Dull or cold joints','Peak too low or TAL too short','Raise peak or TAL within limits'],
 ['Burnt board, damaged parts','Peak too high or too long','Lower temperatures, check thermocouple placement and part limits'],
 ['Voids under BGA or QFN','Ramp too fast, flux outgassing, paste','Longer soak, adjust the profile, consider vacuum reflow'],
 ['Warpage or head-in-pillow','Uneven heating, thin or large board unsupported','Use board support, adjust the profile'],
 ['Boards touch or drop off the conveyor','Wrong rail width, chain problems','Set the rails correctly and service the chain']],
 checks:['All zones at setpoint and stable','Conveyor speed matches the recipe','Profile checked as required and kept in range','Exhaust working, flux filters clean','Nitrogen flow correct (if used)'],
 safety:['Surfaces and exhaust are very hot. Never touch the inside while hot.','Flux fumes must be exhausted. Clean filters on schedule.','Use lock-out and tag-out before any maintenance.'],
 tips:['One profile does not fit all boards. Heavy boards need a slower belt.','If a part changes (new supplier, bigger package) recheck the profile.','Always read the solder paste datasheet and the component limits (J-STD-020).'],
 diagram:'reflow',defects:['tombstone','balls','cold','nonwet','voids','hip','popcorn','warp','burn','crack','bridge']},

{id:'xray',n:'X-ray Inspection (2D)',e:'☢️',grp:'smt',tag:'Sees hidden solder joints under chips like BGA',
 analogy:'Like a hospital X-ray for the board. It shows what is hidden underneath the part.',
 what:'X-ray inspection passes X-rays through the board. Dense materials such as solder (tin, silver, lead) absorb more X-rays and look dark. Voids (air bubbles) look lighter. It is used for joints that cameras cannot see: BGA, QFN, LGA, flip chips and plated through-hole fill. A manual or offline 2D X-ray is used for first article checks, sampling and failure analysis, not for every board in a fast line.',
 where:'An offline station near the line, or after reflow for sampling and analysis.',
 steps:[
 'Safety first: cabinet closed, door interlock working, dosimeter badge if required, only trained users.',
 'Place the board in the tray or fixture and close the door.',
 'Set the voltage (kV) and current (µA) to see the joints clearly without extra exposure. Limit the exposure of sensitive devices such as memory ICs.',
 'Move to the BGA or QFN area and zoom in.',
 'View straight down and then tilted (oblique) to see joints from the side. Head-in-pillow and cracks show better at an angle.',
 'Check each ball: round, same size, centred on the pad, no bridge to neighbours, small voids.',
 'Measure void percentage: void area ÷ ball area, and compare with your standard (IPC-A-610 commonly ≤ 25 % for BGA balls).',
 'Save images with the board serial number, mark good or bad, and send defects to repair or failure analysis.'],
 params:[['Voltage (kV)','Higher for thick or dense boards','More penetration, less contrast'],['Current (µA)','Higher for a brighter image','More heat and dose'],['Magnification','Closer to the source is bigger','Shows small balls'],['Tilt angle','Often up to 60° or more','Shows HiP, opens, cracks'],['Void limit','Per your spec (about 25 % of ball area for BGA)','Reliability'],['Exposure time','As short as possible','Safety and device protection']],
 issues:[
 ['BGA ball bridging','Too much paste or misplaced part','Review printing and placement, contain the lot'],
 ['Open or missing ball','Coplanarity, poor wetting, head-in-pillow','Use the tilt view, check the profile and part warpage'],
 ['High voids','Fast ramp, via-in-pad, moisture, paste','Change the profile, cap or fill vias, check paste, bake parts'],
 ['Image too dark or too bright','Wrong kV or µA','Adjust settings and compare with a good board']],
 checks:['Interlocks and warning lights work','Cabinet undamaged','Known-good board image saved for comparison','Radiation log or badge up to date'],
 safety:['X-rays are ionising radiation. Never bypass interlocks. Keep the cabinet closed. Report any damage or leakage and follow your company radiation safety rules.'],
 tips:['Always compare with a known good board.','X-ray sees metal density, not electrical function. A joint can look good and still be open, so use electrical test too.'],
 diagram:'xray',defects:['voids','hip','bridge','nonwet']},

{id:'axi',n:'AXI (Automated X-ray Inspection)',e:'🩻',grp:'smt',tag:'Inline X-ray that checks hidden joints automatically',
 analogy:'X-ray with a robot brain. It takes images like a manual X-ray, but software decides pass or fail on every board in the line.',
 what:'AXI is an in-line or near-line machine that moves each board through an X-ray station and inspects hidden joints automatically. 2D AXI gives a flat image and works well for single-sided boards. 3D AXI (tomosynthesis, laminography or CT) builds slices of the joint so top and bottom joints do not overlap, which double-sided boards need. It measures ball size, void percentage, bridging, opens, head-in-pillow and hole fill of through-hole joints.',
 where:'After reflow (and sometimes after wave soldering), before test.',
 steps:[
 'Build the program from CAD: positions of BGA, QFN and holes, joint types and measuring windows.',
 'The board enters on the conveyor, is clamped and aligned by fiducials.',
 'The X-ray source and detector take images at several angles at each inspection area.',
 'The software reconstructs slices at the solder level, like cutting the joint into layers.',
 'Each joint is measured: diameter, area, shape, void percentage, bridging and wetting.',
 'Pass or fail is decided by limits. Fails go to the verify station with images.',
 'Defect data goes to the MES (factory data system). Trends show reflow drift.',
 'Warm up the tube, calibrate regularly, and check the cabinet for radiation leakage as required.'],
 params:[['Inspection mode','2D, 2.5D or 3D','Choose by number of board sides and layers'],['Void limit','Per spec (about 25 % for BGA balls)','Quality target'],['Bridge test','Gap analysis between balls','Finds shorts'],['Hole fill (through-hole)','Often ≥ 75 % for Class 2 and 3','Checks wave solder quality'],['Sampling or 100 %','100 % for high-risk products','Cost versus risk'],['Warm-up and calibration','Per vendor schedule','Stable images']],
 issues:[
 ['False fails on double-sided boards','Top and bottom joints overlap in 2D','Use 3D mode or adjust windows'],
 ['Missed defects','Limits too loose or window in the wrong place','Review with sample boards and a microscope or cross-section'],
 ['Image drifting over the day','Tube not warmed up or needs calibration','Warm up and calibrate'],
 ['Cycle time too long','Too many inspection areas','Inspect only critical joints or use sampling']],
 checks:['Warm-up and calibration done','Safety interlocks work','Programs match product revision','Failure images reviewed and recorded'],
 safety:['Same radiation rules as manual X-ray. Never open or bypass guards. Only trained personnel do maintenance.'],
 tips:['AOI sees the outside, AXI sees the inside. Together they cover most joints.','Use AXI data to improve the reflow profile, not only to sort good from bad.'],
 diagram:'xray',defects:['voids','hip','bridge','nonwet','holefill']},

{id:'autoins',n:'Auto Insertion',e:'🔌',grp:'tht',tag:'Machines insert through-hole parts into the holes',
 analogy:'A robot that threads parts through the board like a needle. Leads go through the holes and the legs are bent underneath to hold the part.',
 what:'Auto insertion machines insert through-hole (THT) components automatically: axial parts (resistors, diodes, jumpers), radial parts (electrolytic and ceramic capacitors, LEDs, transistors) and DIP ICs or odd-form parts. Parts come on tape, in tubes or sticks. The machine cuts and forms the leads, inserts them into the plated holes, cuts the lead length and bends (clinches) the legs under the board so the parts stay in place until wave soldering.',
 where:'After the SMT line and before wave soldering or press-fit.',
 steps:[
 'Load the program (X, Y, angle, part type) and the correct tapes in the correct feeder positions. Verify the part numbers.',
 'The board enters. The machine finds its position with fiducials or tooling pins.',
 'The head takes a part from the tape. For axial parts the lead span is formed to match the hole spacing.',
 'The part is inserted. A pin guide leads the lead tips through the holes.',
 'Under the board the clincher cuts the leads to length and bends them to hold the part.',
 'A sensor or camera checks the insertion. Missing parts stop the machine or flag the board.',
 'Output boards go to manual insertion (for odd-form parts) and then to wave solder or press-fit.',
 'At changeover check the first board for part value, polarity (diodes, electrolytic capacitors) and orientation.'],
 params:[['Hole size','Lead diameter + about 0.3 to 0.4 mm','Too tight bends leads, too big loosens the part'],['Lead span','Matches the hole pitch','Wrong span cannot be inserted'],['Clinch angle and length','As the work instruction says','Holds the part without damaging the pad'],['Seating height','Part sits close to the board','Lifted parts cause solder defects'],['Tape condition','Flat, even, dry','Prevents misfeeds'],['Board support','Fixture under the board','Stops board flexing']],
 issues:[
 ['Missed insert (part missing)','Tape feed error, worn cutter, hole misalignment','Check tape, replace the cutter, check hole data and board location'],
 ['Bent or damaged lead','Hole too small, pin guide worn, board warped','Check hole size, replace the guide, support the board'],
 ['Reversed polarity','Wrong tape direction or program angle','Check the tape orientation and the program, do first article'],
 ['Part lifted from the board','Lead too long or clinch too weak','Adjust the clinch and the lead cut length'],
 ['Wrong value loaded','Wrong tape on the feeder','Scan or verify at setup, use a second-person check']],
 checks:['Cutters and guides sharp and clean','Tapes dry and correct','Program matches product revision','First board checked for values and polarity'],
 safety:['Cutters and clinchers are sharp and fast. Keep hands out and use guards. Follow lock-out and tag-out for maintenance.'],
 tips:['Missing parts are easier to find before wave soldering than after.','Mark the polarity clearly on the tape holder for diodes and electrolytic capacitors.'],
 defects:['autoin','polarity','wrongpart','holefill']},

{id:'pressfit',n:'Press-fit',e:'🔩',grp:'tht',tag:'Pushes connector pins into holes without solder',
 analogy:'Like pushing a snug cork into a bottle neck. The pin is slightly wider than the hole and squeezes into it, making a tight metal-to-metal joint.',
 what:'Press-fit uses connectors with compliant pins (such as eye-of-needle pins) that are pressed into plated through-holes with a press machine. No solder is needed. The pin deforms elastically and the spring force against the hole wall gives a gas-tight electrical connection. It is used for backplane and automotive connectors where soldering heat would be a problem.',
 where:'After SMT and before or after wave soldering, depending on the product routing. Always follow the routing sheet.',
 steps:[
 'Check that the board holes are the right finished size and plating (hole diameter and copper thickness) according to the connector datasheet.',
 'Place the board on the support fixture. The support must be directly under the pressing area and not touch parts on the bottom side.',
 'Place the connector over the holes with the right orientation.',
 'The press tool lowers and pushes the connector at a controlled speed.',
 'The machine records force against distance (the force-displacement curve) for every connector.',
 'Pressing stops at the seating height. The curve is compared with an upper and lower limit envelope.',
 'Failed curves, wrong height or visible damage mean the board is rejected or sent for analysis.',
 'Measure the final connector height or standoff and inspect for bent pins.'],
 params:[['Hole size and plating','As the connector datasheet says (finished hole size and copper thickness)','Controls insertion force and holding force'],['Insertion speed','Slow and constant (often a few mm/s)','Protects pins and plating'],['Force-displacement envelope','Upper and lower limits per connector','Detects wrong hole or damaged pin'],['Seating height','Tolerance per drawing','Connector fully seated'],['Support fixture','Matches the board','Prevents board bending and cracks'],['Alignment','Connector straight above the holes','Prevents bent pins']],
 issues:[
 ['Bent or buckled pins','Misaligned connector, wrong hole position or size','Check the alignment tool and the board hole data, never reuse bent pins'],
 ['Force too high','Hole too small, plating too thick, pin out of tolerance','Check hole size with pin gauges, review the supplier data'],
 ['Force too low (loose connector)','Hole too large, plating worn or too thin','Reject the board, check the hole size and plating'],
 ['Connector not fully seated','Press stopped early or tooling worn','Check the seating height setting and the press tool'],
 ['Board cracked or hole damaged','No support under the board, too much force','Support the board correctly and check the force limit']],
 checks:['Force sensor calibrated','Tooling clean and not worn','Support fixture matches the board','Reference curve of a known good insertion is available'],
 safety:['Press machines can crush fingers. Use two-hand controls and light curtains. Never reach under the tool.'],
 tips:['Press-fit connectors should not be reused. Removing them damages the plating.','Keep flux and dirt away from the hole before pressing.'],
 defects:['pfbent','pfseat','crack']},

{id:'wave',n:'Wave Soldering',e:'🌊',grp:'tht',tag:'Solders through-hole parts by passing over molten solder',
 analogy:'Like dragging the underside of the board across a gentle, steady wave of liquid solder. Solder climbs up the holes and wraps the leads.',
 what:'In wave soldering the board is carried over a wave of molten solder. First flux is sprayed on the bottom side, then the board is preheated, then it touches the wave for a few seconds so solder flows into the holes and around the leads. It is the fast method for many through-hole joints. Pallets (fixtures) protect SMD parts on the bottom side. Selective soldering uses a small mini-wave for boards that cannot go through a full wave.',
 where:'After auto insertion and manual insertion, before router and FAOI.',
 steps:[
 'Check the solder pot level and temperature, the flux level and the conveyor speed and angle.',
 'Load boards (or pallets) onto the conveyor with the bottom side down. Use fingers or a pallet to hold them.',
 'The fluxer sprays a thin, even layer of flux on the bottom side. Flux removes oxide and helps solder flow.',
 'Preheat: top-side temperature rises to about 90 to 130 °C so flux activates and solvents dry. This also avoids thermal shock.',
 'The board passes the wave. The first turbulent wave pushes solder into holes and around leads. A smooth (lambda) wave removes excess solder and bridges.',
 'Contact time is about 2 to 4 seconds with the pot at about 255 to 265 °C (lead-free SAC alloys).',
 'The board cools and leaves. Flux residue is left on the bottom unless cleaned.',
 'Check the joints (hole fill, bridges), clean flux if the product needs it, trim leads if required.',
 'Check the solder pot chemistry regularly (copper, lead and iron contamination).'],
 params:[['Flux amount','Thin even coat, flux solid content per datasheet','Too little causes skips and bridges, too much leaves residue'],['Top-side preheat','About 90 to 130 °C','Activates flux, prevents shock'],['Pot temperature','About 255 to 265 °C for SAC alloys, about 245 °C for tin-lead','Controls solder flow'],['Contact time','About 2 to 4 s','Fill versus damage'],['Conveyor angle','About 5 to 7°','Helps solder peel away cleanly'],['Wave height','About half to two-thirds of the board thickness','Contact and fill'],['Lead length','About 1.0 to 2.5 mm below the board','Too long causes bridges and icicles']],
 issues:[
 ['Bridging','Lead too long, little flux, too low preheat, dirty pot','Trim leads, adjust flux and preheat, remove dross'],
 ['Insufficient hole fill','Low preheat, low flux, short contact, small hole to lead gap','Raise preheat, add flux, adjust speed and angle, check hole size'],
 ['Skipped solder (bare pads)','Air or flux trapped, shadowing, wrong pallet design','Check flux, preheat and pallet design'],
 ['Icicles and webbing','Low pot temperature, fast conveyor, contaminated pot','Raise the temperature, adjust the speed, clean or replace the solder'],
 ['Solder balls on the board','Moist flux or board, high conveyor speed','Dry the flux and board, adjust the profile, check the pallets'],
 ['Dull, grainy solder','Contaminated pot (copper, iron), cooling too slow','Run a pot analysis and replace the solder']],
 checks:['Solder level and temperature in range','Dross removed, solder analysed on schedule','Flux level and spray pattern checked','Conveyor speed and angle correct','Pallets clean and undamaged'],
 safety:['Molten solder causes severe burns. Wear heat protection and a face shield when working near the pot.','Fumes must be extracted. Never add water or damp material to the pot.'],
 tips:['Most wave problems come from flux, preheat or contamination. Check those first.','Record a test board with a thermocouple profile regularly.'],
 diagram:'wave',defects:['bridge','holefill','icicle','skip','balls','cold','residue']},

{id:'router',n:'Router (Depaneling)',e:'✂️',grp:'end',tag:'Cuts individual boards out of the panel',
 analogy:'Like cutting separate stamps out of a sheet. It must be clean and gentle, without tearing or cracking the stamps.',
 what:'Many boards are made and assembled together on one panel (array) to save time. After soldering they are separated into single boards. A router machine uses a spinning milling bit to cut through the tabs (small connecting bridges) of the panel. Other methods are V-score cutting, punching, and laser. Routing is gentle, accurate and does not bend the board, but it makes dust that must be removed.',
 where:'After SMT and wave soldering and before final inspection (FAOI) and test. Some products are routed earlier.',
 steps:[
 'Check the panel number, program and fixture for this product.',
 'Place the panel in the fixture. Pins and supports hold it flat and stop it from moving.',
 'The machine reads fiducials to align the cutting path.',
 'The spindle (about 30,000 to 60,000 rpm) lowers a router bit and follows the programmed path through the tabs.',
 'A vacuum removes the dust while it is created.',
 'Cut boards are removed with care and placed in trays. They must not be bent or stacked in a way that causes damage.',
 'Check board edges for burrs, delamination, discolouration and chips. Check parts near the edge for cracks.',
 'Change the bit at the set interval (cut length or board count). Clean the fixture and vacuum.'],
 params:[['Spindle speed','About 30,000 to 60,000 rpm','Clean cut, less heat'],['Feed rate','Per bit and board thickness','Too fast chips edges, too slow burns'],['Bit life','Replace by cut length or counted boards','A worn bit makes burrs and heat'],['Vacuum power','Strong enough to remove dust','Dust shorts and contaminates'],['Edge clearance','Parts kept away from the board edge by design','Prevents stress cracks'],['Fixture support','Supports the panel near the cut','Reduces vibration and bending']],
 issues:[
 ['Burrs or delamination at the edge','Worn bit, wrong feed or speed','Replace the bit, adjust the feed and speed'],
 ['Cracked capacitor near the edge','Board bending or vibration during cutting','Improve the support, check the cutting order, run a strain gauge test'],
 ['Dust on the boards','Weak vacuum, dirty fixture','Clean the vacuum and the fixture, add an air blow or clean step'],
 ['Cut off path or wrong outline','Fiducial error or wrong program','Check the program, the fiducials and the panel type'],
 ['Bit breaks','Panel not held, too fast feed','Check the fixture, lower the feed, replace the bit']],
 checks:['Bit not worn, correct size','Vacuum filter clean','Fixture correct for the panel','First board edge checked','Dust container emptied'],
 safety:['The spindle is fast and sharp. Keep doors closed. Wear eye protection and use dust extraction. Dust from fibreglass is an irritant.'],
 tips:['Never break panels by hand. Bending causes hidden cracks in ceramic capacitors that appear later in the field.','Dust is a contamination risk. Clean it before test and packing.'],
 defects:['routerdust','edgestress','residue']},

{id:'faoi',n:'FAOI (Final AOI)',e:'✅',grp:'end',tag:'The last visual check of the finished board',
 analogy:'The final quality check at a bakery before the box is closed. It makes sure that what leaves the line matches the drawing.',
 what:'FAOI (Final Automated Optical Inspection) checks the finished board after all assembly steps (SMT, through-hole, wave soldering or press-fit, and depaneling). It looks at what the earlier inspections cannot see or what changed afterwards: through-hole parts (presence, orientation, height), wave-solder joints, connectors and pin alignment, labels and barcodes, mechanical damage, foreign material and burrs from routing. Taller parts need side cameras or 3D height sensors.',
 where:'At the end of the line, after router and before electrical test or packing.',
 steps:[
 'Load the program for the product and revision.',
 'The board enters and is aligned by fiducials or fixture pins.',
 'Cameras and lights capture images of the top (and bottom side if needed) from several angles.',
 'The software checks through-hole parts, connectors, markings, labels, barcodes and solder joints against the model.',
 'The result goes to the traceability system. PASS boards continue to test or packing.',
 'FAIL boards go to the verify station where an operator confirms the defect and decides repair or scrap.',
 'Repaired boards must be re-inspected, not simply passed on.',
 'Defects are classified and reviewed so upstream stations can be corrected.'],
 params:[['Inspection windows','Cover through-hole joints, connectors, labels','Do not leave blind spots'],['Height check','3D or side camera for tall parts','Finds lifted parts and bent pins'],['Barcode and label check','Read and match to the work order','Prevents wrong labels shipping'],['Limits','Based on IPC-A-610 and customer rules','Same standard as the customer'],['False calls and escapes','Tracked daily','Program quality'],['Traceability','Serial number linked to results','Recall and analysis']],
 issues:[
 ['Many false calls on solder joints','Flux residue or colour differences','Tune the program, clean the board, control flux'],
 ['Escapes found at test','Missing windows or limits too loose','Add windows, review with the customer return data'],
 ['Bent connector pins missed','Only top-down view','Add a side or 3D height check'],
 ['Wrong label not caught','Label check missing','Add barcode and label matching to the program']],
 checks:['Golden board passes at the start of each shift','Program revision matches the product','Verify station display clear and lit','Repair loop closed (re-inspect after repair)'],
 safety:['Keep hands out of the moving gantry. Follow ESD rules when handling finished boards.'],
 tips:['FAOI is a net, not a fix. Use its defect data to find the cause upstream.','Never release a repaired board without a second inspection.'],
 defects:['bridge','holefill','icicle','pfbent','pfseat','routerdust','edgestress','residue','autoin','polarity']}
];
var GROUPS={smt:{n:'SMT line',d:'Surface-mount process, in line order',e:'🧩'},tht:{n:'Through-hole & press-fit',d:'Parts with leads and connectors',e:'🔌'},end:{n:'Finishing & final check',d:'Separate the boards and inspect them',e:'🏁'}};

var DEFECTS=[
{id:'bridge',n:'Solder bridge (short)',e:'🔗',grp:'smt',sev:3,from:['printer','mounter','reflow','wave'],find:['spi','aoi','xray','axi','faoi'],
 look:'Solder connects two or more pads or leads that must stay separate. It makes a short circuit. Common on fine-pitch ICs, connectors and wave-soldered pins.',
 causes:[['Material','Paste slumps or the wrong paste is used'],['Method','Stencil apertures too large, too much paste volume'],['Machine','Smear under the stencil, misprint, mounter pressing paste out'],['Machine','Reflow ramp too fast; wave: lead too long, low flux or preheat, dirty pot'],['Environment','High humidity or heat']],
 analyze:['Note where it happens: always the same location, or random?','Check SPI data for that pad (volume, offset, bridge flag).','Check AOI placement offset and the print image.','For wave soldering check lead length, flux, preheat and solder condition.','Compare with a good board and a good lot.'],
 fix:['Clean the stencil and increase wipe frequency.','Reduce paste volume (aperture reduction or thinner stencil) if the design allows.','Lower placement force and correct offsets.','Adjust the reflow profile.','Wave: trim leads, adjust flux and preheat, remove dross.','Rework: remove the bridge with a clean iron and flux or wick.'],
 prevent:['Turn on the SPI bridge check and set limits from data.','Set a wipe schedule and check it each shift.','Review stencil design for fine-pitch parts.','Control lead length and wave chemistry.'],
 contain:['Stop and quarantine the boards made since the last good check.','Inspect 100 % of WIP and finished goods from that period (AOI, X-ray, ICT).','Label and record lot, time, line and quantity.','Release the line only after 3 consecutive good boards and a confirmed fix.'],diagram:'bridge'},

{id:'insufficient',n:'Insufficient solder',e:'💧',grp:'smt',sev:2,from:['printer','reflow'],find:['spi','aoi','xray'],

 analyze:['Compare SPI volume for the pad against the limit.','Check if it is the same pad every board (clog) or random (process).','Look at the stencil under light for blocked apertures.','Check paste age and open time.'],
 fix:['Clean the stencil, wipe more often, use fresh paste.','Adjust pressure and speed to fill apertures.','Correct the stencil design if the pad is always low.','Rework by adding solder wire or paste.'],
 prevent:['SPI volume limits and SPC charts.','Paste life tracking on the stencil.','Stencil cleaning schedule and inspection.'],
 contain:['Quarantine boards printed since the last good SPI result.','Re-inspect (AOI or X-ray for hidden joints).','Add the extra inspection until the cause is fixed.'],diagram:'insufficient'},

{id:'excess',n:'Excess solder',e:'🫧',grp:'smt',sev:2,from:['printer','reflow'],find:['spi','aoi'],

{id:'smear',n:'Paste smear / clogged stencil',e:'🖍️',grp:'smt',sev:2,from:['printer'],find:['spi','aoi'],

{id:'slump',n:'Paste slump',e:'🫠',grp:'smt',sev:2,from:['printer','reflow'],find:['spi','aoi'],

{id:'balls',n:'Solder balls and beads',e:'⚪',grp:'smt',sev:2,from:['printer','reflow','wave'],find:['aoi','faoi'],

{id:'shift',n:'Component shift or skew',e:'📐',grp:'smt',sev:2,from:['mounter','reflow'],find:['aoi'],

var GUIDE_FA=[
{t:'The 8 steps (8D-lite)',e:'🧭',body:[
 ['p','Use this order every time a problem appears. It keeps you calm and stops you jumping to the wrong cause.'],
 ['ol',['<b>Describe the problem</b> clearly: what, where, how many, since when, which product and line. Use numbers and photos.','<b>Contain it</b> straight away so bad boards do not move on (see the containment checklist).','<b>Collect facts</b>: SPI, AOI, X-ray data, machine logs, material lots, who and what changed.','<b>Find the root cause</b> with 5 Whys, a fishbone chart (6M) and by comparing good with bad.','<b>Corrective action</b>: fix the cause, not only the symptom.','<b>Check it works</b>: run a trial and confirm the defect rate drops.','<b>Preventive action</b>: update the procedure, setup sheet, program and training so it cannot come back.','<b>Close and record</b>: write a short report and share lessons with the other lines.']]]},
{t:'Analysis tools for beginners',e:'🧰',body:[
 ['ul',['<b>5 Whys</b>: ask "why?" repeatedly until you reach a cause you can control.','<b>Fishbone (6M)</b>: look for causes in Man, Machine, Material, Method, Measurement and Environment.','<b>Is / Is-not</b>: where does it happen and where does it not happen (which board, side, time, line)?','<b>What changed?</b> New paste lot, new reel, new stencil, new program, new shift, maintenance? Most problems follow a change.','<b>Good vs bad</b>: compare the profile, parameters, parts and photos of a good board and a bad board.','<b>Pareto chart</b>: count defect types and fix the biggest one first.','<b>Lab methods</b>: microscope, X-ray, cross-section and SEM for hard cases.']]]},
{t:'Corrective, preventive and containment actions',e:'⚖️',body:[
 ['ul',['<b>Containment action</b>: protects the customer now. Stops, isolates, sorts and re-inspects suspect product. It does not fix the cause.','<b>Corrective action</b>: removes the root cause of the problem that happened.','<b>Preventive action</b>: stops similar problems from happening on other products or lines.','<b>Correction (rework)</b>: repairs the individual defective board.']],
 ['p','Example: tombstones found. Containment = hold boards and 100 % inspect. Correction = rework the tombstoned parts. Corrective = slow the reflow ramp. Preventive = change the pad design rule for all new boards.']]},
{t:'Containment checklist',e:'🚧',body:[
 ['ol',['Stop the line or the affected machine if the defect is serious or repeating.','Put a red tag or label on suspect material. Do not mix with good product.','Define the suspect range: from the last known good check to now.','Check all places: machine, WIP buffers, finished goods, warehouse and shipped product.','Use extra inspection (100 %) such as AOI, X-ray or a visual sort.','Record lot numbers, date codes, quantity, time and who checked.','Tell the supervisor and QA right away.','Release only after the fix is confirmed (for example 3 good boards in a row and a verified check).']]]},
{t:'Worked example 1: tombstones',e:'🪦',body:[
 ['p','<b>Problem:</b> 0402 capacitors tombstone on one board. About 2 % since the new paste lot on Monday.'],
 ['why',['Why do the parts stand up? One end melted and wetted before the other.','Why? One pad heated faster. Paste volume was unbalanced.','Why? The new paste lot is stickier and the print was offset.','Why was the print offset? Printer fiducial camera was dirty after the last wipe.','Why was it not caught? SPI offset limits were set too loose.']],
 ['p','<b>Containment:</b> hold boards printed since Monday, 100 % AOI. <b>Corrective:</b> clean the camera, tighten the SPI offset limit. <b>Preventive:</b> add a camera clean step to the daily checklist and review SPI limits monthly.']]},
{t:'Worked example 2: bridges on a QFP',e:'🔗',body:[
 ['p','<b>Problem:</b> shorts on the same 0.5 mm pitch IC on 5 of every 100 boards.'],
 ['why',['Why shorts? Solder joined pins during reflow.','Why? Paste volume on those pads was high, with smear.','Why? Aperture bottom was dirty and the wipe frequency was every 20 prints.','Why every 20? It was never changed from a coarser-pitch product.','Why not changed? The setup sheet had no pitch-based wipe rule.']],
 ['p','<b>Corrective:</b> wipe every 5 prints for fine-pitch boards. <b>Preventive:</b> update the setup sheet template with wipe rules by pitch. <b>Verify:</b> SPI shows no smear and short rate is zero for 3 shifts.']]}
];
var GUIDE_CC=[
{t:'What is contamination?',e:'🧫',body:[
 ['p','Contamination is anything that should not be on the board, the paste, the parts or the machine. It can be visible or invisible.'],
 ['ul',['<b>Particles</b>: dust, hair, fibres, dross, fibreglass dust.','<b>Chemical</b>: flux residue, oils, silicone, cleaning agent leftovers, ionic salts.','<b>Moisture</b>: absorbed water in boards or plastic parts.','<b>Skin</b>: fingerprints and sweat (salts and oils).','<b>Cross-contamination</b>: lead-free and leaded materials mixed, wrong paste or wrong flux, wrong tools.','<b>Electrostatic</b>: static charge that attracts dust and damages parts.']]]},
{t:'Where it comes from and how to stop it',e:'🗺️',body:[
 ['ul',['<b>Loader and storage</b>: dust, fingerprints, moisture. Use gloves, covers, sealed bags and a humidity card. Bake boards if needed.','<b>Printer</b>: dried paste, dirty wipe paper, solvent residue. Use lint-free wipes, clean stencils, and approved cleaners.','<b>Mounter</b>: dust on nozzles and reels. Clean nozzles and keep reels covered.','<b>Reflow</b>: flux residue builds up in the oven and drips on boards. Clean the flux filters and tunnel on schedule.','<b>Wave solder</b>: dross and flux residue. Remove dross, replace solder per analysis, control flux amount.','<b>Router</b>: fibreglass dust. Use vacuum and a clean-up step.','<b>People</b>: no food or drink, no hand cream, wear gloves, keep ESD discipline.']]]},
{t:'Cleaning and cleanliness tests',e:'🧼',body:[
 ['ul',['<b>No-clean flux</b> leaves a small safe residue for many products. Some high-reliability or high-voltage products still need cleaning.','<b>Wipe cleaning</b> with approved IPA and lint-free cloth for spot cleaning only. Never use wipes that spread residue.','<b>Ultrasonic or spray wash</b> for removing residue after rework or in a defined cleaning process.','<b>Visual</b> inspection under magnification.','<b>ROSE test</b>: measures total ionic contamination of the board surface (historic guide ≈ 1.56 µg NaCl equivalent per cm²; modern limits are set by process and customer).','<b>Ion chromatography</b> identifies which ions are present.','<b>SIR test</b> (surface insulation resistance) checks leakage under heat and humidity.']]]},
{t:'Moisture and ESD control',e:'💧',body:[
 ['ul',['<b>MSL (moisture sensitivity level)</b> tells how long a part can stay out of its sealed bag (floor life). Log the open time. After floor life expires, bake as J-STD-033 says.','Store sensitive parts in dry cabinets or sealed bags with desiccant and a humidity indicator card.','<b>ESD wrist straps</b> must be tested every day. Use grounded mats and ESD-safe boxes. Keep humidity around 40 to 60 %.','Do not use ordinary plastic bags or foam near sensitive boards.']]]},
{t:'If you find contamination: what to do',e:'🚨',body:[
 ['ol',['Stop and tell your supervisor. Do not keep running.','Find out what the contamination is and where it started (sample, microscope, test).','Isolate suspect boards and materials (containment).','Clean boards only by the approved process. Do not invent a new method.','Fix the source (maintenance, procedure, material, training).','Re-test cleanliness and record the result.','Update the checklist so it is checked regularly.']]]}
];

var BASICS=[
{t:'What are PCB and PCBA?',e:'🟩',body:[
 ['p','A <b>PCB</b> (printed circuit board) is the bare green board with copper pads and tracks. It has no parts yet.'],
 ['p','A <b>PCBA</b> (printed circuit board assembly) is the PCB after components are soldered on. This is the working electronic board inside phones, cars, TVs and machines.'],
 ['p','<b>SMT</b> (surface mount technology) means parts are placed on the surface of the board and soldered to pads. <b>THT</b> (through-hole technology) means parts have long leads that go through holes and are soldered on the other side.']]},
{t:'SMT vs through-hole',e:'⚖️',body:[
 ['ul',['<b>SMT</b>: small parts, fast machines, both sides of the board, high density. Most parts today are SMT.','<b>THT</b>: stronger mechanical connection, good for big connectors, transformers and power parts.','Many boards use both (mixed technology): SMT first, then THT and wave solder.']]]},
{t:'A typical line in order',e:'🏭',body:[
 ['ol',['<b>Loader</b>: feeds bare boards.','<b>Printer</b>: prints solder paste.','<b>SPI</b>: checks the paste.','<b>Mounter</b>: places parts.','<b>AOI</b>: checks placement (pre-reflow) or solder (post-reflow).','<b>Reflow oven</b>: melts the paste.','<b>X-ray / AXI</b>: checks hidden joints.','<b>Auto insertion</b>: through-hole parts.','<b>Press-fit</b>: pushes in connectors.','<b>Wave solder</b>: soldering through-hole parts.','<b>Router</b>: cuts boards from the panel.','<b>FAOI</b>: final inspection, then test and packing.']],
 ['p','Real lines vary. Always follow your routing sheet.']]},
{t:'Key materials',e:'🧴',body:[
 ['ul',['<b>Solder paste</b>: tiny solder balls (often SAC305: 96.5 % tin, 3 % silver, 0.5 % copper) mixed with flux. About half the paste volume is metal.','<b>Flux</b>: cleans oxide from metal so solder can wet and stick.','<b>Stencil</b>: thin stainless steel sheet with holes (apertures) at every pad. Typical thickness 100 to 150 µm.','<b>Components</b>: supplied on reels (tape), trays or tubes.','<b>Fiducials</b>: small round copper marks cameras use to find the board position.','<b>Lead-free vs leaded</b>: lead-free (RoHS) solders melt higher (217 °C) than tin-lead (183 °C).']]]},
{t:'Reading part sizes and packages',e:'🔎',body:[
 ['ul',['Chip sizes use numbers like <b>0402</b>. In inches this is 0.04 × 0.02 inch (about 1.0 × 0.5 mm). 0201 is smaller, 0603 and 0805 are bigger.','<b>SOIC, QFP</b>: ICs with leads along the sides. <b>BGA</b>: balls under the part, hidden. <b>QFN</b>: flat pads under the part, hidden.','Hidden joints need X-ray.']]]},
{t:'Quality words you will hear',e:'📊',body:[
 ['ul',['<b>FPY</b> (first pass yield): share of boards that pass without rework.','<b>PPM / DPMO</b>: defects per million parts or opportunities.','<b>Cpk</b>: how well a process stays inside its limits. 1.33 or more is usually considered capable.','<b>IPC-A-610</b>: the common acceptance standard for assembled boards. Class 1 (general), Class 2 (dedicated service), Class 3 (high reliability).','<b>J-STD-001</b>: soldering requirements. <b>J-STD-020/033</b>: moisture-sensitive parts.']]]},
{t:'Five golden rules for beginners',e:'🏅',body:[
 ['ol',['Safety first: guards, interlocks and lock-out tag-out.','Wear your ESD strap and gloves every time. Test the strap.','Follow the work instruction. Do not change settings without approval.','First article inspection every changeover.','If something looks wrong, stop and call the supervisor. A quick stop is cheaper than a wrong lot.']]]}
